---
# https://www.electronjs.org/docs/latest/tutorial/snapcraft
# https://snapcraft.io/docs/the-snap-format
# https://forum.snapcraft.io/t/the-snap-format/698

name: nest-desktop
title: NEST Desktop
license: MIT
version: 4.2.0
base: core24
summary: Simulate spiking neuronal networks
description: |
  Create spiking neuron models, run simulation and analyze the results.
source-code: https://github.com/nest-desktop/nest-desktop-snap
contact: https://github.com/nest-desktop/nest-desktop
website: https://nest-desktop.github.io
issues: https://github.com/nest-desktop/nest-desktop-snap/issues
icon: snap/gui/nest-desktop.png

grade: stable # options: devel, stable
confinement: strict
# compression: lzo

platforms:
  amd64:
  arm64:

apps:
  nest-desktop:
    command: bin/nest-desktop-launch
    common-id: io.github.nest_desktop.nest-desktop
    desktop: usr/share/applications/nest-desktop.desktop
    # environment:
    #   NESTML_MODULES_PATH: /tmp/nestmlmodules
    #   NESTML_SERVER_TIMEOUT: 120
    extensions: [gnome]
    plugs:
      - browser-support # use functions essential for web browsers
      - home # access non-hidden files in the home directory
      - network # enables network access
      - network-bind # operate as a network service

parts:
  bsi-trigger:
    plugin: nil
    source: https://github.com/nest-desktop/nest-desktop-snap.git

  local-parts:
    plugin: dump
    source: snap/local
    source-type: local

  nest-desktop-electron:
    plugin: dump
    source: https://github.com/nest-desktop/nest-desktop-electron/releases/download/v${SNAPCRAFT_PROJECT_VERSION}/nest-desktop-${SNAPCRAFT_PROJECT_VERSION}.tar.gz
    override-build: |
      cp -rv . ${CRAFT_PART_INSTALL}/nest-desktop
      # sed -i 's|Icon=nest-desktop|Icon=/usr/share/icons/hicolor/256x256/apps/nest-desktop.png|' ${CRAFT_PART_INSTALL}/usr/share/applications/nest-desktop.desktop
    stage-packages:
      - libnspr4
      - libnss3

  nest-server:
    plugin: python
    python-packages:
      - nest-server==3.0.0b9
    source: .
    build-packages:
      - build-essential
      - cmake
      - cython3
      - libgsl-dev
      - libltdl-dev
      - libncurses5-dev
      - libreadline-dev
      - pandoc
      - python3-dev
    stage-packages:
      - libgsl-dev
      - libltdl-dev
      - python3

  # backend-server:
  #   plugin: python
  #   python-packages:
  #     - nestml-server@git+https://github.com/babsey/nestml-server@v1.0
  #     # - norse-server@git+https://github.com/babsey/norse-server.git
  #     - --no-deps
  #   source: https://github.com/nest-desktop/nest-desktop-snap
  #   source-depth: 1
  #   source-type: git
  #   stage:
  #     - bin/nestml-server
  #     - lib/python3.10/site-packages/nestml_server
